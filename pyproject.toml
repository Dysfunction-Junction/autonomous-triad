# Tags: cli, ops-runbook
# Links: triad/triad_engine.py, bin/triad
# Queries: "which console scripts does the package install", "what are the runtime dependencies"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-triad"
version = "3.3.0"
description = "Autonomous multi-agent CLI orchestrator: zero-token MCP stripping, advisory-council failover, isolated worktree gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Papa-Bear4216" }]
keywords = ["ai-agents", "code-review", "pre-commit", "claude", "codex", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
proc = ["psutil>=5.9"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",  # Parallel test runner for CI and local gating
    "ruff>=0.6",
    "bandit>=1.7",
    "psutil>=5.9",
]

[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# triad_engine.py is the dispatcher hub, and every submodule import in it is written
# twice: `try: from triad.X import (...)` then `except ImportError: from X import (...)`.
# Ruff reads the second copy as unused because the first already bound the names, and it
# cannot see that the second copy is what makes a flat/installed layout work. Deleting
# either half breaks one of the two supported layouts, and the names are also re-exported
# to callers (`triad.server`'s /doctor route and several test modules import helpers from
# `triad.triad_engine`, not from their defining module). Genuinely dead imports were
# removed from this file by hand; this ignore covers only the intentional surface.
"triad/triad_engine.py" = ["F401"]

[tool.bandit]
exclude_dirs = ["triad/tests", "triad/bench/.cache"]

[tool.pytest.ini_options]
testpaths = ["triad/tests"]

[project.scripts]
triad = "triad.triad_engine:main"
triad-agent = "triad.agent.cli:main"

[project.urls]
Homepage = "https://github.com/Papa-Bear4216/autonomous-triad"

[tool.setuptools]
packages = ["triad", "triad.bench", "triad.agent"]
include-package-data = true

[tool.setuptools.package-data]
triad = ["advisors.json", "empty-mcp.json"]
"triad.bench" = ["swebench_instances.json", "cases/*", "cases_v1/*"]
